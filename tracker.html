<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vikim Tracker - Cleaning & Fumigation</title>
<style>
body{font-family:Arial;background:#f0f8ff;margin:0;padding:15px}
.header{background:#0077cc;color:white;padding:15px;border-radius:10px;text-align:center}
.card{background:white;padding:15px;border-radius:10px;margin:10px 0}
input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
button{background:#0077cc;color:white;padding:12px;border:none;border-radius:8px;width:100%;font-weight:bold}
button.green{background:#00aa44}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{flex:1;background:white;padding:8px;border-radius:10px;text-align:center;min-width:70px}
.stat b{font-size:18px;color:#0077cc;display:block}
.hidden{display:none}
.item{border-left:4px solid #0077cc;padding:8px;margin:8px 0;background:#f9f9f9;font-size:14px}
.item.fum{border-left-color:#ff6600}
.badge{padding:2px 6px;border-radius:4px;color:white;font-size:10px}
.clean{background:#0077cc}.fumig{background:#ff6600}
</style>
</head>
<body>
<div id="login">
<div class="header"><h2>VIKIM STAFF LOGIN</h2><p>Cleaning + Fumigation Tracker</p></div>
<div class="card">
<input type="password" id="pin" placeholder="PIN 0717">
<button onclick="login()">Login</button>
</div>
</div>
<div id="app" class="hidden">
<div class="header"><h2>VIKIM TRACKER</h2><p>Cleaning & Fumigation - Makutano</p></div>
<div class="stats">
<div class="stat"><b id="total">0</b>Total</div>
<div class="stat"><b id="inter">0</b>Interested</div>
<div class="stat"><b id="clean">0</b>Cleaning</div>
<div class="stat"><b id="fum">0</b>Fumigation</div>
</div>
<div class="card">
<h3>+ Add Customer</h3>
<select id="serviceType" onchange="changeService()">
<option value="Carpet Cleaning">Carpet Cleaning</option>
<option value="Sofa Cleaning">Sofa Cleaning</option>
<option value="Mattress Cleaning">Mattress Cleaning</option>
<option value="Fumigation - Bedsitter">FUMIGATION - Bedsitter (1.5k-2k)</option>
<option value="Fumigation - 1 Bedroom">FUMIGATION - 1 Bedroom (2.5k-3k)</option>
<option value="Fumigation - 2 Bedroom">FUMIGATION - 2 Bedroom (3.5k-4.5k)</option>
<option value="Fumigation - 3 Bedroom">FUMIGATION - 3 Bedroom (5k-6k)</option>
<option value="Fumigation - Compound/Mabati">FUMIGATION - Compound / Mabati</option>
<option value="Both - Cleaning + Fumigation">BOTH - Cleaning + Fumigation (BEST)</option>
</select>
<input id="name" placeholder="Name">
<input id="estate" placeholder="Estate e.g. Likii, Baraka">
<input id="phone" placeholder="Phone 07...">
<select id="status">
<option>New</option><option>Interested</option><option>Ordered</option><option>Not Interested</option>
</select>
<input id="note" placeholder="Details: e.g. 3 cockroaches, bedsitter Likii A, 2 carpets">
<input id="price" placeholder="Price Quoted e.g. 3000">
<button class="green" onclick="add()">Save</button>
</div>
<div class="card">
<input id="search" placeholder="Search..." onkeyup="render()">
<div style="margin:8px 0">
<button onclick="filterS('All')" style="width:auto;padding:5px 10px;font-size:12px">All</button>
<button onclick="filterS('Fumigation')" style="width:auto;padding:5px 10px;background:#ff6600;font-size:12px">Fumigation Only</button>
<button onclick="filterS('Cleaning')" style="width:auto;padding:5px 10px;font-size:12px">Cleaning Only</button>
</div>
<div id="list"></div>
</div>
<div class="card">
<button onclick="exportFum()">Export Fumigation Orders for Today (WhatsApp)</button>
</div>
</div>
<script>
let customers=JSON.parse(localStorage.getItem('vikim_v2')||'[]');
let currentFilter='All';
function login(){if(pin.value=='0717'){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render()}else alert('PIN 0717')}
function changeService(){
let v=serviceType.value;
if(v.includes('Bedsitter')) price.value='2000';
if(v.includes('1 Bedroom')) price.value='3000';
if(v.includes('2 Bedroom')) price.value='4000';
if(v.includes('3 Bedroom')) price.value='5500';
}
function add(){
let c={id:Date.now(),service:serviceType.value,name:name.value,estate:estate.value,phone:phone.value,status:status.value,note:note.value,price:price.value,date:new Date().toLocaleDateString()};
if(!c.name||!c.phone){alert('Name & Phone');return;}
customers.unshift(c);localStorage.setItem('vikim_v2',JSON.stringify(customers));
name.value=estate.value=phone.value=note.value=price.value='';render();
}
function filterS(t){currentFilter=t;render()}
function render(){
let f=search.value.toLowerCase();list.innerHTML='';total.innerText=customers.length;
inter.innerText=customers.filter(x=>x.status=='Interested').length;
clean.innerText=customers.filter(x=>!x.service.includes('Fumigation')||x.service.includes('Both')).length;
fum.innerText=customers.filter(x=>x.service.includes('Fumigation')).length;
customers.filter(c=>{
let ok=(c.name+c.estate+c.service).toLowerCase().includes(f);
if(currentFilter=='Fumigation') ok=ok&&c.service.includes('Fumigation');
if(currentFilter=='Cleaning') ok=ok&&!c.service.includes('Fumigation');
return ok;
}).forEach(c=>{
let d=document.createElement('div');d.className='item '+(c.service.includes('Fumigation')?'fum':'');
let badgeClass=c.service.includes('Fumigation')?'fumig':'clean';
d.innerHTML=`<span class="badge ${badgeClass}">${c.service}</span><br><b>${c.name}</b> - ${c.estate}<br>📞 ${c.phone} | ${c.status} | Ksh ${c.price}<br><small>${c.note} | ${c.date}</small><br><a href="https://wa.me/254${c.phone.slice(-9)}?text=Habari ${c.name}, ni Victor wa VIKIM Cleaning & Fumigation Makutano. Ulisema ${c.service} - ${c.note}. Bei ni ${c.price}. Niko na team leo Nanyuki, nikupitie saa ngapi?" style="color:green;font-weight:bold">→ WhatsApp Follow Up</a> <span onclick="del(${c.id})" style="color:red;cursor:pointer"> | Delete</span>`;
list.appendChild(d);
});
}
function del(id){customers=customers.filter(c=>c.id!=id);localStorage.setItem('vikim_v2',JSON.stringify(customers));render();}
function exportFum(){
let fumOrders=customers.filter(c=>c.service.includes('Fumigation'));
let text=`*VIKIM FUMIGATION ORDERS TODAY ${new Date().toLocaleDateString()}*%0ATotal Fumigation Leads: ${fumOrders.length}%0A%0A`;
fumOrders.forEach(c=>{text+=`🏠 ${c.service}%0A${c.name} - ${c.estate} - ${c.phone} - Ksh${c.price} - ${c.note}%0A%0A`});
window.open(`https://wa.me/?text=${text}`,'_blank');
}
</script>
</body>
</html>
