<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Vikim Tracker - Fixed</title><style>body{font-family:Arial;background:#f0f8ff;margin:0;padding:15px}.header{background:#0077cc;color:white;padding:15px;border-radius:10px;text-align:center}.card{background:white;padding:15px;border-radius:10px;margin:10px 0}input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}button{background:#0077cc;color:white;padding:12px;border:none;border-radius:8px;width:100%;font-weight:bold}button.green{background:#00aa44}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{flex:1;background:white;padding:8px;border-radius:10px;text-align:center;min-width:70px}.stat b{font-size:18px;color:#0077cc;display:block}.hidden{display:none}.item{border-left:4px solid #0077cc;padding:8px;margin:8px 0;background:#f9f9f9;font-size:14px}.item.fum{border-left-color:#ff6600}.badge{padding:2px 6px;border-radius:4px;color:white;font-size:10px}.clean{background:#0077cc}.fumig{background:#ff6600}</style></head><body><div id="loginDiv"><div class="header"><h2>VIKIM STAFF LOGIN</h2><p>Cleaning + Fumigation FIXED</p></div><div class="card"><input type="password" id="pinInput" placeholder="PIN 0717"><button onclick="doLogin()">Login</button></div></div><div id="appDiv" class="hidden"><div class="header"><h2>VIKIM TRACKER</h2><p>Cleaning & Fumigation - Makutano</p></div><div class="stats"><div class="stat"><b id="totalStat">0</b>Total</div><div class="stat"><b id="interStat">0</b>Interested</div><div class="stat"><b id="cleanStat">0</b>Cleaning</div><div class="stat"><b id="fumStat">0</b>Fumigation</div></div><div class="card"><h3>+ Add Customer</h3><select id="serviceType"><option>Carpet Cleaning</option><option>Sofa Cleaning</option><option>Mattress Cleaning</option><option>Fumigation - Bedsitter</option><option>Fumigation - 1 Bedroom</option><option>Fumigation - 2 Bedroom</option><option>Fumigation - 3 Bedroom</option><option>Fumigation - Compound</option><option>Both - Cleaning + Fumigation</option></select><input id="custName" placeholder="Customer Name"><input id="custEstate" placeholder="Estate - e.g. Likii"><input id="custPhone" placeholder="Phone 07..."><select id="custStatus"><option>New</option><option>Interested</option><option>Ordered</option><option>Not Interested</option></select><input id="custNote" placeholder="Details - e.g. Bedbugs"><input id="custPrice" placeholder="Price e.g. 3000"><button class="green" onclick="addCustomer()">Save Customer</button></div><div class="card"><input id="searchBox" placeholder="Search..." onkeyup="renderList()"><div style="margin:8px 0"><button onclick="filterType('All')" style="width:auto;padding:5px 10px;font-size:12px">All</button><button onclick="filterType('Fumigation')" style="width:auto;padding:5px 10px;background:#ff6600;font-size:12px">Fumigation Only</button><button onclick="filterType('Cleaning')" style="width:auto;padding:5px 10px;font-size:12px">Cleaning Only</button></div><div id="listArea"></div></div></div><script>let customers=JSON.parse(localStorage.getItem('vikim_v2')||'[]');let currentFilter='All';function doLogin(){let p=document.getElementById('pinInput').value;if(p=='0717'){document.getElementById('loginDiv').classList.add('hidden');document.getElementById('appDiv').classList.remove('hidden');renderList()}else alert('Wrong PIN')}function addCustomer(){let nameVal=document.getElementById('custName').value.trim();let estateVal=document.getElementById('custEstate').value.trim();let phoneVal=document.getElementById('custPhone').value.trim();let serviceVal=document.getElementById('serviceType').value;let statusVal=document.getElementById('custStatus').value;let noteVal=document.getElementById('custNote').value.trim();let priceVal=document.getElementById('custPrice').value.trim();if(!nameVal||!phoneVal){alert('Please type Name and Phone!');return;}let c={id:Date.now(),service:serviceVal,name:nameVal,estate:estateVal,phone:phoneVal,status:statusVal,note:noteVal,price:priceVal,date:new Date().toLocaleDateString()};customers.unshift(c);localStorage.setItem('vikim_v2',JSON.stringify(customers));document.getElementById('custName').value='';document.getElementById('custEstate').value='';document.getElementById('custPhone').value='';document.getElementById('custNote').value='';document.getElementById('custPrice').value='';renderList();alert('Saved! '+nameVal)}function filterType(t){currentFilter=t;renderList()}function renderList(){let searchVal=document.getElementById('searchBox').value.toLowerCase();let listDiv=document.getElementById('listArea');listDiv.innerHTML='';document.getElementById('totalStat').innerText=customers.length;document.getElementById('interStat').innerText=customers.filter(x=>x.status=='Interested').length;document.getElementById('cleanStat').innerText=customers.filter(x=>!x.service.includes('Fumigation')||x.service.includes('Both')).length;document.getElementById('fumStat').innerText=customers.filter(x=>x.service.includes('Fumigation')).length;customers.filter(c=>{let ok=(c.name+c.estate+c.service).toLowerCase().includes(searchVal);if(currentFilter=='Fumigation')ok=ok&&c.service.includes('Fumigation');if(currentFilter=='Cleaning')ok=ok&&!c.service.includes('Fumigation');return ok;}).forEach(c=>{let d=document.createElement('div');d.className='item '+(c.service.includes('Fumigation')?'fum':'');let badgeClass=c.service.includes('Fumigation')?'fumig':'clean';d.innerHTML=`<span class="badge ${badgeClass}">${c.service}</span><br><b>${c.name}</b> - ${c.estate}<br>📞 ${c.phone} | ${c.status} | Ksh ${c.price}<br><small>${c.note} | ${c.date}</small><br><a href="https://wa.me/254${c.phone.slice(-9)}?text=Habari ${c.name}, ni Victor wa VIKIM Cleaning & Fumigation Makutano. Ulisema ${c.service} - ${c.note}. Bei ni ${c.price}. Niko na team leo, nikupitie?" style="color:green;font-weight:bold;text-decoration:none">→ WhatsApp Client</a> <span onclick="deleteCust(${c.id})" style="color:red;cursor:pointer"> | Delete</span>`;listDiv.appendChild(d);});}function deleteCust(id){if(confirm('Delete?')){customers=customers.filter(c=>c.id!=id);localStorage.setItem('vikim_v2',JSON.stringify(customers));renderList();}}</script></body></html>
